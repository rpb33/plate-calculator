<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f1" />
    <meta name="description" content="Find the closest plate loading for your warm-up and working sets. Barbell or dumbbell, always within your target." />
    <title>Plate Calculator</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main class="calculator">
      <header class="app-header">
        <h1>Plate Calculator<span class="title-dot" aria-hidden="true">.</span></h1>
        <span class="unit-tag" aria-label="All weights in kilograms">KG</span>
      </header>

      <form id="controls" novalidate aria-label="Weight and equipment">
        <div class="weight-inputs">
          <div class="weight-field">
            <label for="target">Target weight</label>
            <div class="input-wrap">
              <input id="target" name="target" type="text" inputmode="decimal" value="100" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="target-error weight-context" />
              <span aria-hidden="true">kg</span>
            </div>
            <p id="target-error" class="field-error" hidden></p>
          </div>
          <div class="weight-field">
            <label for="bar">Bar weight</label>
            <div class="input-wrap">
              <input id="bar" name="bar" type="text" inputmode="decimal" value="20" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="bar-error weight-context" />
              <span aria-hidden="true">kg</span>
            </div>
            <p id="bar-error" class="field-error" hidden></p>
          </div>
        </div>

        <div class="equipment-inputs">
          <fieldset>
            <legend>Equipment</legend>
            <div class="segmented">
              <label><input type="radio" name="mode" value="barbell" checked /><span>Barbell</span></label>
              <label><input type="radio" name="mode" value="dumbbell" /><span>Dumbbell</span></label>
            </div>
          </fieldset>
          <fieldset>
            <legend>Plate diameter</legend>
            <div class="segmented">
              <label><input type="radio" name="diameter" value="30" /><span>30 mm</span></label>
              <label><input type="radio" name="diameter" value="50" checked /><span>50 mm</span></label>
            </div>
          </fieldset>
        </div>
        <p id="weight-context" class="context">Total includes one bar. Load both sides equally.</p>
      </form>

      <section class="sets" aria-labelledby="sets-heading">
        <div class="section-heading"><h2 id="sets-heading">Your sets</h2><span>Always at or below target</span></div>
        <div id="results"></div>
        <p id="announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
      </section>
      <footer>Using example plate inventory<span aria-hidden="true"> · </span>All weights in kg</footer>
      <noscript><p class="noscript">Enable JavaScript to calculate your plate loading.</p></noscript>
    </main>
  </body>
</html>
